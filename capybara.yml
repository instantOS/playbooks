---
- name: Capybara setup
  hosts: capybara
  become: true

  vars:
    hostname: capybara
    swap_file_size_mb: "4096"
    firewall_allowed_tcp_ports:
      - "22"
      - "25"
      - "80"
      - "443"
      - "25565"
      - "42695"
      - "3000"
      - "64738"
      - "8008"
      - "8085"
      - "8080"
      - "8096"
      - "8888"
      - "9005"
      - "1935"
      - "1936"
      - "19132"
      - "8000"
      - "8443"
    firewall_allowed_udp_ports:
      - "64738"
      - "1935"
      - "6000"
      - "25565"
      - "19132"
    firewall_flush_rules_and_chains: true

  vars_files:
    - vars/basics.yml
    - secrets.yml

  pre_tasks:
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ hostname }}"

  roles:
    - ubuntu
    - grog.sudo
    - earlyoom
    - geerlingguy.firewall
    - geerlingguy.security
    # - geerlingguy.swap
    - geerlingguy.docker
    - role: caddy
      tags: caddy
    - role: instantosmirror
      tags: instantosmirror
    - role: restreamer
      tags: restreamer
