---
bifrost_domain: bifrost.paperbenni.xyz
bifrost_listen_address: 127.0.0.1
bifrost_port: 8085
bifrost_data_dir: /var/lib/bifrost

bifrost_vpn_host: fortivpn.uni-freiburg.de
bifrost_vpn_port: 443
bifrost_vpn_user: ""
bifrost_vpn_password: ""
bifrost_vpn_realm: ""
# Optional certificate pin for the VPN gateway. Leave empty: the gateway
# certificate validates against the container's system CA store, so no
# manual cert setup is needed.
bifrost_vpn_trusted_cert: ""

bifrost_admin_username: admin
bifrost_admin_password: ""
bifrost_encryption_key: ""
bifrost_max_request_body_size_mb: 50
