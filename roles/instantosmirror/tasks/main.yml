---
- name: Install wget for mirror sync
  ansible.builtin.apt:
    name:
      - wget
    state: present

- name: Create mirror directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ instantosmirror_data_dir }}"
    - "{{ instantosmirror_data_dir }}/snapshots"
    - "{{ instantosmirror_wkd_data_dir }}/.well-known/openpgpkey"

- name: Deploy WKD keys and policy
  ansible.builtin.copy:
    src: wkd/
    dest: "{{ instantosmirror_wkd_data_dir }}/.well-known/openpgpkey/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

- name: Install mirror sync script
  ansible.builtin.copy:
    src: sync-instantos-mirror.sh
    dest: /usr/local/bin/sync-instantos-mirror
    owner: root
    group: root
    mode: "0755"

- name: Bootstrap first mirror sync
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/sync-instantos-mirror
      {{ instantosmirror_upstream_url }}
      {{ instantosmirror_data_dir }}
      {{ instantosmirror_keep_snapshots }}
    creates: "{{ instantosmirror_data_dir }}/current"

- name: Schedule periodic mirror sync
  ansible.builtin.cron:
    name: instantos-mirror-sync
    user: root
    cron_file: instantos-mirror
    minute: "{{ instantosmirror_sync_minute }}"
    hour: "{{ instantosmirror_sync_hour }}"
    job: >-
      /usr/local/bin/sync-instantos-mirror
      {{ instantosmirror_upstream_url }}
      {{ instantosmirror_data_dir }}
      {{ instantosmirror_keep_snapshots }}

- name: Create instantOS packages Caddy configuration
  ansible.builtin.copy:
    dest: /etc/caddy/conf.d/packages.caddy
    content: |
      {{ instantosmirror_domain }} {
        root * {{ instantosmirror_data_dir }}/current
        file_server browse
      }
    mode: "0644"
  notify: reload caddy

- name: Create instantOS WKD Caddy configuration
  ansible.builtin.copy:
    dest: /etc/caddy/conf.d/openpgpkey.caddy
    content: |
      {{ instantosmirror_wkd_domain }} {
        root * {{ instantosmirror_wkd_data_dir }}
        file_server

        header {
          Access-Control-Allow-Origin *
        }

        @hu path */hu/*
        header @hu Content-Type application/octet-stream
      }
    mode: "0644"
  notify: reload caddy
