---
- name: Ensure hermes is running
  community.docker.docker_compose_v2:
    project_name: hermes
    pull: "always"
    definition:
      services:
        hermes:
          image: nousresearch/hermes-agent:latest
          container_name: hermes
          restart: unless-stopped
          command: gateway run
          ports:
            - "8642:8642"
            - "9119:9119"
          volumes:
            - "/tank/data/hermes/.hermes:/opt/data"
          environment:
            - HERMES_DASHBOARD=1
          deploy:
            resources:
              limits:
                memory: 4G
                cpus: "2.0"
