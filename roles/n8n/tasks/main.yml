---
- name: Ensure n8n is set up
  community.docker.docker_compose_v2:
    project_name: n8n
    definition:
      services:
        n8n:
          image: docker.n8n.io/n8nio/n8n:latest
          pull_policy: always
          restart: always
          ports:
            - "127.0.0.1:5678:5678"
          dns:
            - "1.1.1.1"
            - "8.8.8.8"
          environment:
            N8N_HOST: n8n.paperbenni.xyz
            N8N_PORT: "5678"
            N8N_PROTOCOL: https
            N8N_PROXY_HOPS: "1"
            N8N_RUNNERS_AUTH_TOKEN: "{{ n8n_runners_auth_token }}"
            N8N_RUNNERS_BROKER_LISTEN_ADDRESS: "0.0.0.0"
            N8N_RUNNERS_ENABLED: "true"
            N8N_RUNNERS_MODE: external
            N8N_NATIVE_PYTHON_RUNNER: "true"
            NODE_ENV: production
            WEBHOOK_URL: https://n8n.paperbenni.xyz/
            DOMAIN_NAME: paperbenni.xyz
            SUBDOMAIN: n8n
            GENERIC_TIMEZONE: Europe/Berlin
            SSL_EMAIL: paperbenni@gmail.com
          volumes:
            - n8n_data:/home/node/.n8n
            - /apps/n8n/files:/files
        task-runners:
          image: n8nio/runners:latest
          pull_policy: always
          restart: always
          depends_on:
            - n8n
          dns:
            - "1.1.1.1"
            - "8.8.8.8"
          environment:
            N8N_RUNNERS_AUTH_TOKEN: "{{ n8n_runners_auth_token }}"
            N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      volumes:
        n8n_data:
- name: Add n8n to caddy
  ansible.builtin.copy:
    dest: /etc/caddy/conf.d/n8n.caddy
    mode: "0644"
    content: |
      n8n.paperbenni.xyz {
      reverse_proxy localhost:5678
      }
